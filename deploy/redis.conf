# Softcast self-hosted Redis configuration.
#
# Softcast keeps ALL durable state in Redis (sessions, screens, lighting state,
# ownership). Without persistence, a Redis restart wipes every session and screen.
# Start Redis with this file:  redis-server /path/to/redis.conf

# --- Durability: append-only file (primary) ---------------------------------
appendonly yes
appendfsync everysec
# Rewrite the AOF when it grows past these thresholds to keep it compact.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Durability: RDB snapshots (secondary, for fast restarts/backups) -------
# Snapshot if at least N keys changed within the window.
save 900 1
save 300 10
save 60 10000
# Refuse writes if a snapshot fails, so data loss is loud rather than silent.
stop-writes-on-bgsave-error yes

# --- Memory ------------------------------------------------------------------
# Softcast data is small and must never be evicted. Do NOT set an eviction
# policy that drops keys; if maxmemory is reached we want errors, not silent
# loss of sessions.
maxmemory-policy noeviction

# --- Access ------------------------------------------------------------------
# Bind to the private interface only and require a password. Adjust to your VPS.
# bind 127.0.0.1 ::1
# requirepass CHANGE_ME_STRONG_PASSWORD
# Pass the matching REDIS_URL to the backend, e.g.
#   REDIS_URL=redis://:CHANGE_ME_STRONG_PASSWORD@127.0.0.1:6379
